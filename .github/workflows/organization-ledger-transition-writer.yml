name: Organization Ledger Transition Writer

# Writer only (the split of StegVerse-Labs/.github#3255). COMMITTED_REQUEST: the
# push to main that commits a request file under
# .stegverse/transition-ledger/requests/ is the trigger. There is no dispatch,
# schedule or input, and no default epoch: communication_id, packet_id and
# hb_epoch are read from the committed file (resident-runtime/transition_request.py),
# the epoch's lower bound from the ledger head. A missing field is NOT_SUPPLIED,
# a contradicted one INVALID, each six fields, and nothing is written. The run
# then performs the intr-destination diagnostic self-closure: it appends the
# repository receipt (it carries communication_id and the request digest) and
# the organization receipt that preserves it to refs/stegverse/organization-ledger, pushes that ref
# fast-forward only, and reads both receipts back from a fresh fetch.
# This workflow has no pull_request trigger, so no PR-triggered job holds
# contents: write. The PR-facing checks are
# .github/workflows/organization-ledger-transition.yml (read-only).
on:
  push:
    branches: [main]
    paths:
      - '.stegverse/transition-ledger/requests/**'

permissions:
  contents: read

# ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with
# organization-ledger-merge-transfer.yml. The push is the compare-and-swap
# against the published ref, so a writer that lost the race fails closed
# instead of overwriting.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind the designated organization ledger ref
        run: |
          set -euo pipefail
          locators=$(python3 resident-runtime/organization_ledger_readback.py --designated-locators "$GITHUB_WORKSPACE")
          echo "$locators"
          ref=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ref"])' "$locators")
          test "$ref" = "$LEDGER_REF"
          namespace=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["namespace"])' "$locators")
          org_root=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["organization_locator"])' "$locators")
          repo_root=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["repository_locator"])' "$locators")
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          # Locators contain '#'. The append step exports them in its own shell.
          test -n "$org_root" && test -n "$repo_root"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it"
          fi

      - name: Read the committed request
        run: |
          set -euo pipefail
          locators=$(python3 resident-runtime/organization_ledger_readback.py --designated-locators "$GITHUB_WORKSPACE")
          export STEGVERSE_ORG_LEDGER_ROOT=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["organization_locator"])' "$locators")
          export STEGVERSE_REPO_LEDGER_ROOT=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["repository_locator"])' "$locators")
          mkdir -p "$RUNNER_TEMP/results"
          python3 resident-runtime/transition_request.py --before "$BEFORE" --after "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/results/request.json"
          python3 - "$RUNNER_TEMP/results/request.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1]))
          print("REQUEST_DISPOSITION=" + x["disposition"])
          if x["disposition"] == "ALLOW":
              print("STEGVERSE_COMMUNICATION_ID=" + x["communication_id"])
              print("STEGVERSE_PACKET_ID=" + x["packet_id"])
              print("STEGVERSE_HB_EPOCH=" + str(x["hb_epoch"]))
              print("STEGVERSE_REQUEST_SHA256=" + x["request_sha256"])
          PY

      - name: Append the intr-destination diagnostic self-closure
        if: env.REQUEST_DISPOSITION == 'ALLOW'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          for name in ("STEGVERSE_COMMUNICATION_ID", "STEGVERSE_PACKET_ID", "STEGVERSE_HB_EPOCH", "STEGVERSE_REQUEST_SHA256"):
              value = os.environ.get(name, "")
              if not value.strip() or any(ord(character) < 32 or ord(character) > 126 for character in value):
                  print("FAIL_CLOSED: " + name + "_NOT_A_PRINTABLE_TOKEN")
                  sys.exit(1)
          epoch = int(os.environ["STEGVERSE_HB_EPOCH"])
          if epoch < 32:
              print("FAIL_CLOSED: HB_EPOCH_BEFORE_ANCHOR")
              sys.exit(1)
          PY
          locators=$(python3 resident-runtime/organization_ledger_readback.py --designated-locators "$GITHUB_WORKSPACE")
          export STEGVERSE_ORG_LEDGER_ROOT=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["organization_locator"])' "$locators")
          export STEGVERSE_REPO_LEDGER_ROOT=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["repository_locator"])' "$locators")
          case "$STEGVERSE_ORG_LEDGER_ROOT" in
            git+*"#$LEDGER_REF") ;;
            *) echo "FAIL_CLOSED: ORGANIZATION_LOCATOR_DOES_NOT_NAME_THE_REF" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/results"
          python3 resident-runtime/intr_destination_ingress.py --self-closure \
            --registry org-boundary/registry/services.json \
            --out "$RUNNER_TEMP/results/ingress.json"
          python3 -c 'import json,os,sys; x=json.load(open(sys.argv[1])); assert x["disposition"]=="ALLOW", x; assert x.get("communication_id"); assert x["repository_receipt_observed"] is True; assert x["organization_receipt_observed"] is True; assert x["production_receipt_claimed"] is False; assert x["communication_id"]==os.environ["STEGVERSE_COMMUNICATION_ID"]; print("closure", x["communication_id"], x["repository_receipt_sha256"], x["organization_receipt_sha256"])' \
            "$RUNNER_TEMP/results/ingress.json"

      - name: Publish the ledger ref (fast-forward only)
        if: env.REQUEST_DISPOSITION == 'ALLOW'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_NOT_APPENDED","failed_predicate":"SELF_CLOSURE_APPENDED_TO_THE_REF","authority_constraint":"NONE_PUBLISH_ONLY","time_constraint":"HEARTBEAT_EPOCH","production_receipt_claimed":false}'
            exit 1
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","detail":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","next_attempt":"re-run; the same packet is answered from the ledger when it is already recorded","authority_constraint":"NONE_PUBLISH_ONLY","time_constraint":"HEARTBEAT_EPOCH","production_receipt_claimed":false}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        if: env.REQUEST_DISPOSITION == 'ALLOW'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","detail":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","next_attempt":"retry with repository contents permission","authority_constraint":"NONE_READBACK_ONLY","time_constraint":"HEARTBEAT_EPOCH","production_receipt_claimed":false}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python3 resident-runtime/organization_ledger_readback.py \
            --location "git+$fresh#$LEDGER_REF" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --ingress-result "$RUNNER_TEMP/results/ingress.json" \
            --out "$RUNNER_TEMP/results/readback.json"
          {
            echo '### organization ledger readback'
            echo '```json'
            cat "$RUNNER_TEMP/results/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
