name: Organization Ledger Transition

# PR-facing and read-only (the writer split of StegVerse-Labs/.github#3255):
# pull_request and push run the redirected-root tests and a verify of the
# published ledger on a temporary copy. Nothing here appends or pushes, and no
# job holds contents: write. The workflow_dispatch self-closure writer is
# .github/workflows/organization-ledger-transition-writer.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - '.stegverse/transition-ledger/**'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'tests/test_organization_ledger_publication.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_ledger_transition_writer_split.py'
      - '.github/workflows/organization-ledger-transition.yml'
      - '.github/workflows/organization-ledger-transition-writer.yml'
  push:
    branches: [main]
    paths:
      - '.stegverse/transition-ledger/**'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/organization_ledger_readback.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'tests/test_organization_ledger_publication.py'
      - 'tests/test_intr_destination_capability.py'
      - 'tests/test_ledger_transition_writer_split.py'
      - '.github/workflows/organization-ledger-transition.yml'
      - '.github/workflows/organization-ledger-transition-writer.yml'

permissions:
  contents: read

# Nothing here appends, so these runs never take the appender lock
# (ORGANIZATION_LEDGER_LOCK, group organization-ledger, is held by the writers).
concurrency:
  group: organization-ledger-verify-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate ledger contracts, self-closure, and readback on a redirected root
        run: python3 -m unittest tests.test_organization_ledger_publication tests.test_intr_destination_capability tests.test_ledger_transition_writer_split -v

  transition:
    # Verify only, read-only token: the dispatch writer is
    # organization-ledger-transition-writer.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary (verify, no persisted credential)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the published ledger ref (verify, no persisted credential)
        uses: actions/checkout@v4
        with:
          ref: refs/stegverse/organization-ledger
          path: .published-ledger
          persist-credentials: false

      - name: 'Verify: bind the designated ref, copy the published ledger into a temporary ledger, read it back'
        run: |
          set -euo pipefail
          for dir in . .published-ledger; do
            if git -C "$dir" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
              echo '{"disposition":"FAIL_CLOSED","failure_code":"VERIFY_CREDENTIAL_PERSISTED","failed_predicate":"VERIFY_RUN_HOLDS_NO_PERSISTED_CREDENTIAL","required_evidence_or_repair":"the verify checkouts must use persist-credentials: false","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"restore persist-credentials: false and re-run; nothing was appended"}'
              exit 1
            fi
          done
          locators=$(python3 resident-runtime/organization_ledger_readback.py --designated-locators "$GITHUB_WORKSPACE")
          ref=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ref"])' "$locators")
          test "$ref" = "$LEDGER_REF"
          namespace=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["namespace"])' "$locators")
          before=$(git -C .published-ledger rev-parse HEAD)
          dry="$RUNNER_TEMP/verify-ledger.git"
          # The ledger checkout is shallow (its tree holds every receipt); a shallow
          # repository cannot be fetched from, so the temporary ledger is a copy of it.
          cp -a .published-ledger/.git "$dry"
          git --git-dir="$dry" config core.bare true
          git --git-dir="$dry" update-ref "$LEDGER_REF" HEAD
          test "$(git --git-dir="$dry" rev-parse "$LEDGER_REF")" = "$before"
          mkdir -p "$RUNNER_TEMP/results"
          python3 resident-runtime/organization_ledger_readback.py \
            --location "git+$dry#$LEDGER_REF" \
            --repository-namespace "$namespace" \
            --out "$RUNNER_TEMP/results/readback.json" > /dev/null
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/results/readback.json"))
          summary = {k: r.get(k) for k in ("disposition", "chain_length", "head_receipt_sha256",
                                           "every_receipt_verifies_against_its_body")}
          print(json.dumps({"mode": "VERIFY", "ledger": "TEMPORARY_COPY", "append_attempted": False,
                            "published": False, **summary}, sort_keys=True))
          if r.get("disposition") != "ALLOW" or r.get("every_receipt_verifies_against_its_body") is not True:
              raise SystemExit(1)
          PY
          # the copy is untouched by the readback
          test "$(git --git-dir="$dry" rev-parse "$LEDGER_REF")" = "$before"
          {
            echo "### organization ledger verify (temporary copy; no append; nothing published)"
            echo '```json'
            python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/results/readback.json")); print(json.dumps({k: r.get(k) for k in ("disposition","chain_length","head_receipt_sha256")}, indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
