name: SV-011 Org Boundary Source Validation

on:
  pull_request:
    paths:
      - "org-boundary/**"
      - "resident-runtime/**"
      - "tests/**"
      - "tools/**"
      - "SV_011_ORG_RUNTIME_MIRROR_HANDOFF.md"
      - ".github/workflows/**"
      - "tests/test_workflow_action_pins.py"
      - "tests/test_workflow_triggers.py"
  push:
    branches: [main]
    paths:
      - "org-boundary/**"
      - "resident-runtime/**"
      - "tests/**"
      - "tools/**"
      - "SV_011_ORG_RUNTIME_MIRROR_HANDOFF.md"
      - ".github/workflows/**"
      - "tests/test_workflow_action_pins.py"
      - "tests/test_workflow_triggers.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate declared source tasks
        run: python tools/run_declared_tasks.py
      - name: Assert no workflow triggers on manual dispatch or schedule
        run: python -m unittest tests.test_workflow_triggers -v
      - name: Assert the ledger transition writer reads a committed request
        run: python -m unittest tests.test_transition_request -v
      - name: Assert workflow actions are pinned to commit shas
        run: python -m unittest tests.test_workflow_action_pins -v
      - name: Assert validation-only authority
        run: |
          python - <<'PY'
          import json
          p=json.load(open("org-boundary/provenance.json"))
          assert p["github_actions_is_runtime_authority"] is False
          assert p["hb_carrier_grants_authority"] is False
          print("SV011_GITHUB_VALIDATION_AUTHORITY_NONE")
          PY
